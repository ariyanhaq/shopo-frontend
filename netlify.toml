[build]
  command = "npm run build"
  publish = "dist"

# Proxy /api requests directly to the VPS Backend
[[redirects]]
  from = "/api/*"
  to = "https://shopo-api.vidflix.live/api/:splat"
  status = 200
  force = true

# Single Page Application (SPA) routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
